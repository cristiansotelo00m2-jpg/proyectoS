<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventana Emergente</title>
    <style>
        /* Estilos del botón principal */
        .btn-abrir {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        /* El fondo oscuro que cubre la pantalla */
        .modal-background {
            display: none; /* Oculto por defecto */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Fondo semitransparente */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* La caja de la ventana emergente */
        .modal-contenido {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        /* Botón para cerrar */
        .btn-cerrar {
            margin-top: 15px;
            padding: 8px 15px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. El botón que activa el modal -->
    <button class="btn-abrir" id="abrirModal">Abrir Ventana</button>

    <!-- 2. La estructura del Modal -->
    <div class="modal-background" id="miModal">
        <div class="modal-contenido">
            <h3>¡Hola!</h3>
            <p>Esta es una ventana emergente personalizada.</p>
            <button class="btn-cerrar" id="cerrarModal">Cerrar</button>
        </div>
    </div>

    <!-- 3. El script que controla el comportamiento -->
    <script>
        const botonAbrir = document.getElementById('abrirModal');
        const botonCerrar = document.getElementById('cerrarModal');
        const modal = document.getElementById('miModal');

        // Mostrar el modal cambiando el display a 'flex'
        botonAbrir.addEventListener('click', () => {
            modal.style.display = 'flex';
        });

        // Ocultar el modal al hacer clic en cerrar
        botonCerrar.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // Opcional: Cerrar también si se hace clic fuera de la caja blanca
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>

</body>
</html>
