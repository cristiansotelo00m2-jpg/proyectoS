<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenidos a EcoGreen</title>
    <link rel="stylesheet" href="static/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <header>
        <div class="d-flex align-items-center gap-2 fw-bold" style="font-size: 14px; letter-spacing: 0.08em;">
            <span><strong>SOURCE VISION GAIN</strong></span>
        </div>
        <nav>
    <a href="{{ url_for('home') }}">Inicio</a>
    <a href="{{ url_for('quienes_somos') }}">¿Quiénes somos?</a>
    <a href="{{ url_for('formulario') }}">Gestión de usuarios</a>
    <a href="{{ url_for('ventas') }}">Ventas</a>
    <a href="{{ url_for('seguimiento') }}">Seguimiento</a>
</nav>
    </header>

    <main>
        <section class="flex flex-col md:flex-row justify-around items-center max-w-[1100px] mx-auto mt-[30px] mb-[30px] gap-[30px] text-center px-4">
            <article class="flex-1 flex flex-col items-center">
                <h2 class="font-bold text-lg mb-6 text-[#4f7d67]">CARACTERÍSTICAS DE NUESTROS PRODUCTOS</h2>
                <div class="overflow-hidden rounded-lg shadow-sm">
                    <img src="static/imagenes/platos.png" alt="productos" class="w-[600px] h-auto object-contain">
                </div>
            </article>
            <article class="flex-1 flex flex-col items-center">
                <h2 class="font-bold text-lg mb-6 text-[#4f7d67]">COMO SE VEN</h2>
                <div class="overflow-hidden rounded-lg shadow-sm">
                    <img src="static/imagenes/prodictos.png" alt="productos" class="w-[400px] max-w-full h-auto object-contain">
                </div>
            </article>
        </section>

        <!-- Botón carrito -->
        <div class="flex justify-end max-w-[1100px] mx-auto px-4 mb-4">
            <a href="gestiondeseguimiento.html" class="relative inline-flex items-center gap-2 bg-[#4f7d67] text-white font-bold px-5 py-2 rounded-lg">
                🛒 Ver carrito
                <span id="carrito-contador" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
            </a>
        </div>

        <h2 class="text-center text-green-800 text-3xl font-bold mb-8">NUESTROS PRODUCTOS</h2>

        <div class="grid lg:grid-cols-3 md:grid-cols-2 gap-6 p-4 max-w-[1100px] mx-auto">
            <div class="border border-gray-200 rounded-xl p-4 shadow-sm bg-white">
                <img class="w-full h-48 object-cover rounded-lg mb-4" src="static/imagenes/plato mini.png" alt="Plato mini">
                <h3 class="font-bold text-lg">Plato Mini</h3>
                <div class="flex justify-between items-center mt-4">
                    <p class="text-green-700 text-xl font-bold">$45.000</p>
                    <button
                        onclick="agregarAlCarrito('Plato Mini', 45000, 'imagenes/plato mini.png')"
                        class="bg-[#4f7d67] text-white text-sm font-bold px-4 py-2 rounded-lg hover:bg-[#3d6352] transition">
                        AGREGAR
                    </button>
                </div>
            </div>

            <!-- Agrega más productos con el mismo patrón -->
        </div>
    </main>

    <footer>
        <p>Derechos de autor © 2024 EcoGreen. Todos los derechos reservados.</p>
    </footer>

    <script>
        function agregarAlCarrito(nombre, precio, imagen) {
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            const existe = carrito.find(p => p.nombre === nombre);
            if (existe) {
                existe.cantidad += 1;
            } else {
                carrito.push({ nombre, precio, imagen, cantidad: 1 });
            }
            localStorage.setItem('carrito', JSON.stringify(carrito));
            actualizarContador();

            // Feedback visual
            const btn = event.target;
            btn.textContent = '✓ AGREGADO';
            btn.classList.add('bg-green-500');
            setTimeout(() => {
                btn.textContent = 'AGREGAR';
                btn.classList.remove('bg-green-500');
            }, 1000);
        }

        function actualizarContador() {
            const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            const total = carrito.reduce((sum, p) => sum + p.cantidad, 0);
            const contador = document.getElementById('carrito-contador');
            if (total > 0) {
                contador.textContent = total;
                contador.classList.remove('hidden');
            } else {
                contador.classList.add('hidden');
            }
        }

        actualizarContador();
    </script>
</body>
</html>
